<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito | HuertoHogar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-huerto sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="../assets/images/huertohogar-logo.png" alt="HuertoHogar" height="40">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <a href="carrito.html" class="btn btn-outline-huerto btn-sm position-relative">
            Carrito
            <span id="contador-carrito" class="badge rounded-pill bg-danger d-none">0</span>
          </a>
          <div id="zona-sesion" class="d-flex"></div>
        </div>
      </div>
    </div>
  </nav>

  <section class="seccion">
    <div class="container">
      <h1 class="mb-4">Tu carrito</h1>

      <div class="row">
        <div class="col-lg-8">
          <div id="lista-carrito"></div>
        </div>
        <div class="col-lg-4">
          <div class="card card-producto p-3">
            <h2 class="h5 font-heading">Resumen</h2>
            <div class="d-flex justify-content-between">
              <span>Total</span>
              <span id="carrito-total" class="carrito-total">$0</span>
            </div>
            <form onsubmit="return confirmarPedido(event)" class="mt-3">
              <label for="pedido-fecha-entrega" class="form-label small">Fecha de entrega preferida</label>
              <input type="date" id="pedido-fecha-entrega" class="form-control mb-3" required>
              <button type="submit" class="btn btn-huerto w-100">Confirmar pedido</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer-huerto text-center">
    <div class="container">
      <p class="mb-0">&copy; 2026 HuertoHogar — Del campo al hogar</p>
    </div>
  </footer>

  <div id="zona-toast" class="position-fixed bottom-0 end-0 m-3 p-2 bg-dark text-white rounded d-none"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/productos.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/carrito.js"></script>
  <script src="../assets/js/pedidos.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
