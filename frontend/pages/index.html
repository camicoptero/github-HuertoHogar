<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuertoHogar | Del campo al hogar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  

  <nav class="navbar navbar-expand-lg navbar-huerto sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="../assets/images/huertohogar-logo.png" alt="HuertoHogar" height="40">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <a href="carrito.html" class="btn btn-outline-huerto btn-sm position-relative">
            Carrito
            <span id="contador-carrito" class="badge rounded-pill bg-danger d-none">0</span>
          </a>
          <div id="zona-sesion" class="d-flex"></div>
        </div>
      </div>
    </div>
  </nav>

  

  <section class="hero-huerto">
    <div class="container">
      <div class="row align-items-center g-4">
        <div class="col-lg-6 text-center text-lg-start">
          <h1 class="display-5">Del campo directo a tu hogar</h1>
          <p class="lead">Frutas, verduras y productos orgánicos frescos, entregados en más de 7 ciudades de Chile.</p>
          <a href="catalogo.html" class="btn btn-huerto btn-lg mt-2">Ver catálogo</a>
        </div>
        <div class="col-lg-6 text-center">
          <img src="../assets/images/huertohogar-hero.jpg" alt="Familia HuertoHogar en la huerta" class="img-fluid rounded-4 shadow-sm">
        </div>
      </div>
    </div>
  </section>

 

  <section class="seccion">
    <div class="container">
      <h2 class="text-center mb-4">Nuestras categorías</h2>
      <div class="row g-3">
        <div class="col-6 col-md-4">
          <a href="catalogo.html?categoria=frutas" class="text-decoration-none">
            <div class="card card-producto text-center p-3 h-100">
              <h3 class="h6 font-heading mb-0">Frutas Frescas</h3>
            </div>
          </a>
        </div>
        <div class="col-6 col-md-4">
          <a href="catalogo.html?categoria=verduras" class="text-decoration-none">
            <div class="card card-producto text-center p-3 h-100">
              <h3 class="h6 font-heading mb-0">Verduras Orgánicas</h3>
            </div>
          </a>
        </div>
        <div class="col-12 col-md-4">
          <a href="catalogo.html?categoria=organicos" class="text-decoration-none">
            <div class="card card-producto text-center p-3 h-100">
              <h3 class="h6 font-heading mb-0">Productos Orgánicos</h3>
            </div>
          </a>
        </div>
      </div>
    </div>

  <footer class="footer-huerto text-center">
    <div class="container">
      <p class="mb-0">&copy; 2026 HuertoHogar — Del campo al hogar</p>

  <div id="zona-toast" class="position-fixed bottom-0 end-0 m-3 p-2 bg-dark text-white rounded d-none"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../assets/js/productos.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/carrito.js"></script>
  <script src="../assets/js/main.js"></script>
