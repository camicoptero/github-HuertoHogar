<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | HuertoHogar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <nav class="navbar navbar-huerto">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="../assets/images/huertohogar-logo.png" alt="HuertoHogar" height="40">
      </a>
    </div>
  </nav>

  <section class="seccion">
    <div class="container" style="max-width: 420px;">
      <div class="card card-producto p-4">
        <h1 class="h4 font-heading text-center mb-3">Crear cuenta</h1>
        <form onsubmit="return registrarUsuario(event)">
          <div class="mb-3">
            <label for="registro-nombre" class="form-label">Nombre completo</label>
            <input type="text" id="registro-nombre" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="registro-correo" class="form-label">Correo electronico</label>
            <input type="email" id="registro-correo" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="registro-clave" class="form-label">Contraseña</label>
            <input type="password" id="registro-clave" class="form-control" minlength="6" required>
            <div class="form-text">Minimo 6 caracteres.</div>
          </div>
          <p id="registro-mensaje" class="small"></p>
          <button type="submit" class="btn btn-huerto w-100">Crear cuenta</button>
        </form>
        <p class="text-center small mt-3 mb-0">
          ¿Ya tienes cuenta? <a href="login.html">Inicia sesioSn</a>
        </p>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
