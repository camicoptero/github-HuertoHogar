<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil | HuertoHogar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-huerto sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="../assets/images/huertohogar-logo.png" alt="HuertoHogar" height="40">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <a href="carrito.html" class="btn btn-outline-huerto btn-sm position-relative">
            Carrito
            <span id="contador-carrito" class="badge rounded-pill bg-danger d-none">0</span>
          </a>
          <div id="zona-sesion" class="d-flex"></div>
        </div>
      </div>
    </div>
  </nav>

  <section class="seccion">
    <div class="container">
      <h1 class="mb-4">Mi perfil</h1>
      <div class="row">
        <div class="col-lg-6">
          <div class="card card-producto p-4">
            <h2 class="h5 font-heading">Mis datos</h2>
            <form onsubmit="return guardarPerfil(event)">
              <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" id="perfil-nombre" class="form-control" disabled>
              </div>
              <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" id="perfil-correo" class="form-control" disabled>
              </div>
              <div class="mb-3">
                <label class="form-label">Direccion donde entrega</label>
                <input type="text" id="perfil-direccion" class="form-control">
              </div>
              <div class="mb-3">
                <label class="form-label">Telefono de contacto</label>
                <input type="tel" id="perfil-telefono" class="form-control">
              </div>
              <p id="perfil-mensaje" class="small"></p>
              <button type="submit" class="btn btn-huerto">Guardar cambios</button>
            </form>
          </div>
        </div>
        <div class="col-lg-6">
          <h2 class="h5 font-heading">Historial de compras</h2>
          <div id="historial-compras"></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer-huerto text-center">
    <div class="container">
      <p class="mb-0">&copy; 2026 HuertoHogar — Del campo al hogar</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/productos.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/perfil.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
